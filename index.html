<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Prototype heritage-trail app for Singapore's Civic District: Journey to Nationhood." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
    <title>Civic Trail · Journey to Nationhood</title>
  </head>
  <body>
    <div class="stage">
      <div class="phone">
        <div class="app" id="app">
          <div class="statusbar" aria-hidden="true">
            <span class="statusbar__time"><span id="status-time">9:58</span><svg width="13" height="13" viewBox="0 0 24 24"><path fill="currentColor" d="M21 3 3 10.53v.98l6.84 2.65L12.48 21h.98z"/></svg></span>
            <span class="statusbar__notch"></span>
            <span class="statusbar__icons">
              <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
              <svg width="17" height="12" viewBox="0 0 24 17"><path fill="currentColor" d="M12 3.5c3.4 0 6.5 1.3 8.8 3.5L23 4.8C20.1 2 16.2.3 12 .3S3.9 2 1 4.8L3.2 7C5.5 4.8 8.6 3.5 12 3.5zm0 5c2 0 3.9.8 5.3 2.1l2.2-2.2C17.5 6.5 14.9 5.4 12 5.4S6.5 6.5 4.5 8.4l2.2 2.2C8.1 9.3 10 8.5 12 8.5zm0 5c-.9 0-1.8.4-2.4 1L12 17l2.4-2.5c-.6-.6-1.5-1-2.4-1z"/></svg>
              <span class="statusbar__battery">50</span>
            </span>
          </div>

          <div id="map" class="map" role="region" aria-label="Map of the Civic District"></div>

          <header class="topbar" id="topbar"></header>
          <div class="route-top" id="route-top"></div>
          <div class="map-tools" id="map-tools"></div>
          <div class="fab-stack" id="fab-stack"></div>
          <div class="home-bottom" id="home-bottom"></div>

          <section id="sheet" class="sheet">
            <button type="button" class="sheet__handle" hidden><span class="sheet__grip"></span><span class="sheet__peek"></span></button>
            <div class="sheet__body"></div>
          </section>

          <div id="nav" class="nav" hidden></div>
          <section id="screen" class="screen" role="dialog" aria-modal="true" hidden></section>
          <div id="stamp-fx" class="stamp-fx" aria-hidden="true"></div>
          <div id="toast" class="toast" role="status"></div>
          <div id="error" class="error-overlay" hidden></div>
        </div>
      </div>

      <aside id="demo-panel" class="demo-panel" aria-label="Demo controls"></aside>
    </div>

    <button type="button" id="demo-fab" class="demo-fab" aria-label="Open demo controls" aria-expanded="false" aria-controls="demo-panel">🧭</button>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
